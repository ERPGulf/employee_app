docs: |-
  # Create New Password

  Sets the login password of the employee whose number matches `mobile_no` exactly, after an OTP from `generate otp for login`. It is the employee's ERP website password too; their mobile Authentication policy never changes.

  ## Authentication
  POST only, with the app's Bearer token.

  ## Parameters

  | Name         | Type   | Required | Description |
  |--------------|--------|----------|-------------|
  | mobile_no    | string | Yes      | Employee's mobile number |
  | otp          | string | Yes      | OTP from `generate otp for login`; spent only when everything else passes |
  | new_password | string | Yes      | The new password; never the app's "egf..." placeholder |

  ## Response (always nested under `data`)

  - 200 `{"data": {"status": "success", "message": "Password updated successfully", "employee_id": "<id>"}}`
  - 400 `Please choose a different password` · 401 `Invalid or expired OTP` · 403 `Password setup is not available` · 404 `No employee user found for the given phone number` · 429 `Too many attempts. Try again later.`

  ## Notes
  - Allowed only while the login policy reports `otp_verified_password_setup` (mobile app) or `erp_web_password_setup_allowed` (OTP-only employees) as `true`; both tenant switches are off by default.
  - Other sessions of the employee end; their app signs in again.
  - See `docs/auth-api-contract.md` for the full contract.
