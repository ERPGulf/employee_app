docs: |-
  # Sign In API

      Completes sign-in after `sign in otp generation` has sent an OTP — step 2
      of OTP-based sign-in when `custom_otp_policy` is `Mandatory` or
      `Optional`. Never changes the employee's login password.

      ## Authentication
      Requires a valid Bearer token.

      ## Parameters

      | Name      | Type   | Required    | Description                                                                          |
      |-----------|--------|-------------|---------------------------------------------------------------------------------------|
      | mobile_no | string | Yes         | Same phone number passed to `sign in otp generation`                                  |
      | otp       | string | Conditional | OTP from `generate otp for login`, required when the policy needs one. Single use; 5 wrong codes destroy it |
      | password  | string | Yes         | Always sent. Checked when the policy needs a password; for OTP-only sign-in the app sends its placeholder, which is ignored. Never stored or set here |

      ## Response

      Success:
      ```json
      {
        "status": "success",
        "data": {
          "token": {
            "access_token": "...",
            "refresh_token": "...",
            "token_type": "bearer",
            "expires_in": 3600,
            "scope": "..."
          },
          "employee": {
            "id": "HR-EMP-00003",
            "employee_name": "John Doe",
            "phone": "5xxxxxxxx",
            "email": "john.doe@example.com"
          },
          "password_policy": "Mandatory",
          "otp_policy": "Mandatory",
          "time": "2026-06-17 12:46:00"
        }
      }
      ```

      Error — invalid/expired OTP:
      ```json
      {
        "status": "error",
        "message": "Invalid or expired OTP"
      }
      ```

      Error — invalid password:
      ```json
      {
        "status": "error",
        "message": "Invalid password"
      }
      ```

      ## Notes
      - `mobile_no` and `password` are always required (400 otherwise); `otp` is required when the policy says so. The number must match exactly one Active employee.
      - Sign-in never writes the login password, so a password the employee uses on the ERP website stays valid. Passwords are set only by `sign up` (first time) and `create new password`.
      - 10 wrong passwords or OTPs in an hour lock the employee for 15 minutes: HTTP 429 `{"status": "error", "message": "Too many attempts. Try again later."}`.
      - A consumed OTP is deleted from the cache immediately, so it cannot be replayed on a later call.
      - On success, returns the same OAuth2 access + refresh token pair as `sign up`.
